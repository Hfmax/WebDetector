<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Descripteur d'Images IA</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>📸 Descripteur d'Images avec IA</h1>
        
        <div class="camera-section">
            <video id="video" autoplay playsinline></video>
            <canvas id="canvas" style="display: none;"></canvas>
        </div>
        
        <div class="controls">
            <button id="startCamera" class="btn btn-primary">Activer la caméra</button>
            <button id="captureBtn" class="btn btn-success" disabled>Capturer et Décrire</button>
            <button id="stopCamera" class="btn btn-danger" disabled>Arrêter la caméra</button>
        </div>
        
        <div id="status" class="status"></div>
        
        <div id="imageContainer" class="image-container"></div>
        
        <div id="descriptionContainer" class="description-container">
            <h3>Description générée :</h3>
            <p id="description"></p>
        </div>
    </div>
    
    <script type="module" src="app.js"></script>
</body>
</html>
