<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Descripteur d'Images IA</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
        }

        .camera-section {
            position: relative;
            width: 100%;
            max-width: 640px;
            margin: 0 auto 20px;
            border-radius: 10px;
            overflow: hidden;
            background: #000;
        }

        #video {
            width: 100%;
            display: block;
        }

        .controls {
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn-primary {
            background: #667eea;
            color: white;
        }

        .btn-primary:hover:not(:disabled) {
            background: #5568d3;
        }

        .btn-success {
            background: #48bb78;
            color: white;
        }

        .btn-success:hover:not(:disabled) {
            background: #38a169;
        }

        .btn-danger {
            background: #f56565;
            color: white;
        }

        .btn-danger:hover:not(:disabled) {
            background: #e53e3e;
        }

        .status {
            text-align: center;
            padding: 15px;
            margin-bottom: 20px;
            border-radius: 8px;
            font-weight: 600;
            display: none;
        }

        .status.loading {
            background: #fef3c7;
            color: #92400e;
        }

        .status.success {
            background: #d1fae5;
            color: #065f46;
        }

        .status.error {
            background: #fee2e2;
            color: #991b1b;
        }

        .image-container {
            text-align: center;
            margin-bottom: 20px;
        }

        .image-container img {
            max-width: 100%;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .description-container {
            background: #f7fafc;
            padding: 20px;
            border-radius: 10px;
            display: none;
        }

        .description-container.show {
            display: block;
        }

        .description-container h3 {
            color: #2d3748;
            margin-bottom: 10px;
        }

        .description-container p {
            color: #4a5568;
            font-size: 18px;
            line-height: 1.6;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📸 Descripteur d'Images avec IA</h1>
        
        <div class="camera-section">
            <video id="video" autoplay playsinline></video>
            <canvas id="canvas" style="display: none;"></canvas>
        </div>
        
        <div class="controls">
            <button id="startCamera" class="btn btn-primary">Activer la caméra</button>
            <button id="captureBtn" class="btn btn-success" disabled>Capturer et Décrire</button>
            <button id="stopCamera" class="btn btn-danger" disabled>Arrêter la caméra</button>
        </div>
        
        <div id="status" class="status"></div>
        
        <div id="imageContainer" class="image-container"></div>
        
        <div id="descriptionContainer" class="description-container">
            <h3>Description générée :</h3>
            <p id="description"></p>
        </div>
    </div>
    
    <script>
        // Variables globales
        let stream = null;

        // Éléments DOM
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const captureBtn = document.getElementById('captureBtn');
        const startCameraBtn = document.getElementById('startCamera');
        const stopCameraBtn = document.getElementById('stopCamera');
        const status = document.getElementById('status');
        const imageContainer = document.getElementById('imageContainer');
        const description = document.getElementById('description');
        const descriptionContainer = document.getElementById('descriptionContainer');

        // Fonctions d'affichage de statut
        function showStatus(message, type) {
            status.textContent = message;
            status.className = 'status ' + type;
            status.style.display = 'block';
        }

        function hideStatus() {
            status.style.display = 'none';
        }

        // Démarrer la caméra
        async function startCamera() {
            try {
                if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                    showStatus('❌ Erreur : Accès caméra nécessite HTTPS.', 'error');
                    return;
                }
                
                showStatus('Démarrage de la caméra...', 'loading');
                
                stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { 
                        facingMode: 'environment',
                        width: { ideal: 1280 },
                        height: { ideal: 720 }
                    } 
                });
                
                video.srcObject = stream;
                video.style.display = 'block';
                
                captureBtn.disabled = false;
                stopCameraBtn.disabled = false;
                startCameraBtn.disabled = true;
                
                showStatus('✅ Caméra activée ! Cliquez sur "Capturer" pour analyser.', 'success');
                setTimeout(hideStatus, 3000);
                
            } catch (error) {
                showStatus('❌ Erreur: ' + error.message, 'error');
                console.error('Erreur caméra:', error);
            }
        }

        // Arrêter la caméra
        function stopCamera() {
            if (stream) {
                stream.getTracks().forEach(track => track.stop());
                video.srcObject = null;
                video.style.display = 'none';
                stream = null;
                
                captureBtn.disabled = true;
                stopCameraBtn.disabled = true;
                startCameraBtn.disabled = false;
            }
        }

        // Capturer et analyser l'image
        async function captureAndDescribe() {
            try {
                showStatus('📸 Capture de l\'image...', 'loading');
                
                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;
                
                const ctx = canvas.getContext('2d');
                ctx.drawImage(video, 0, 0);
                
                const imageDataUrl = canvas.toDataURL('image/jpeg', 0.8);
                imageContainer.innerHTML = '<img src="' + imageDataUrl + '" alt="Image capturée">';
                
                showStatus('🤖 Analyse par IA (Hugging Face)...', 'loading');
                
                // Convertir en Blob
                const response = await fetch(imageDataUrl);
                const blob = await response.blob();
                
                // Appel API Hugging Face (gratuit)
                const apiResponse = await fetch(
                    "https://api-inference.huggingface.co/models/Salesforce/blip-image-captioning-base",
                    {
                        method: "POST",
                        body: blob,
                    }
                );
                
                const result = await apiResponse.json();
                
                if (result.error) {
                    if (result.error.indexOf('loading') !== -1) {
                        showStatus('⏳ Le modèle se charge sur le serveur, réessayez dans 20 secondes...', 'loading');
                    } else {
                        showStatus('❌ Erreur API: ' + result.error, 'error');
                    }
                    return;
                }
                
                const generatedText = result[0].generated_text;
                description.textContent = generatedText.charAt(0).toUpperCase() + generatedText.slice(1);
                descriptionContainer.classList.add('show');
                
                showStatus('✅ Description générée avec succès !', 'success');
                setTimeout(hideStatus, 3000);
                
            } catch (error) {
                showStatus('❌ Erreur: ' + error.message, 'error');
                console.error('Erreur complète:', error);
            }
        }

        // Event listeners
        startCameraBtn.addEventListener('click', startCamera);
        stopCameraBtn.addEventListener('click', stopCamera);
        captureBtn.addEventListener('click', captureAndDescribe);

        window.addEventListener('beforeunload', function() {
            stopCamera();
        });
    </script>
</body>
</html>
