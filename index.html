<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Descripteur d'Images IA</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
        }
        h1 { text-align: center; color: #333; margin-bottom: 30px; }
        .camera-section {
            position: relative;
            width: 100%;
            max-width: 640px;
            margin: 0 auto 20px;
            border-radius: 10px;
            overflow: hidden;
            background: #000;
        }
        #video { width: 100%; display: block; }
        .controls {
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }
        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn-primary { background: #667eea; color: white; }
        .btn-success { background: #48bb78; color: white; }
        .btn-danger { background: #f56565; color: white; }
        .status {
            text-align: center;
            padding: 15px;
            margin-bottom: 20px;
            border-radius: 8px;
            font-weight: 600;
            display: none;
        }
        .status.loading { background: #fef3c7; color: #92400e; }
        .status.success { background: #d1fae5; color: #065f46; }
        .status.error { background: #fee2e2; color: #991b1b; }
        .image-container { text-align: center; margin-bottom: 20px; }
        .image-container img {
            max-width: 100%;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        .description-container {
            background: #f7fafc;
            padding: 20px;
            border-radius: 10px;
            display: none;
        }
        .description-container.show { display: block; }
        .description-container h3 { color: #2d3748; margin-bottom: 10px; }
        .description-container p { color: #4a5568; font-size: 18px; line-height: 1.6; }
    </style>
</head>
<body>
    <div class="container">
        <h1>📸 Descripteur d'Images avec IA</h1>
        
        <div class="camera-section">
            <video id="video" autoplay playsinline></video>
            <canvas id="canvas" style="display: none;"></canvas>
        </div>
        
        <div class="controls">
            <button id="startCamera" class="btn btn-primary">Activer la caméra</button>
            <button id="captureBtn" class="btn btn-success" disabled>Capturer et Décrire</button>
            <button id="stopCamera" class="btn btn-danger" disabled>Arrêter la caméra</button>
        </div>
        
        <div id="status" class="status"></div>
        <div id="imageContainer" class="image-container"></div>
        
        <div id="descriptionContainer" class="description-container">
            <h3>Description générée :</h3>
            <p id="description"></p>
        </div>
    </div>
    
    <script type="module">
        import { pipeline } from 'https://cdn.jsdelivr.net/npm/@xenova/transformers@2.17.2';

        let stream = null;
        let captioner = null;

        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const captureBtn = document.getElementById('captureBtn');
        const startCameraBtn = document.getElementById('startCamera');
        const stopCameraBtn = document.getElementById('stopCamera');
        const status = document.getElementById('status');
        const imageContainer = document.getElementById('imageContainer');
        const description = document.getElementById('description');
        const descriptionContainer = document.getElementById('descriptionContainer');

        function showStatus(message, type) {
            status.textContent = message;
            status.className = 'status ' + type;
            status.style.display = 'block';
        }

        function hideStatus() {
            status.style.display = 'none';
        }

        async function loadModel() {
            if (captioner) return;
            
            showStatus('🔄 Chargement du modèle IA (30-60s, une seule fois)...', 'loading');
            
            try {
                captioner = await pipeline('image-to-text', 'Xenova/vit-gpt2-image-captioning', {
                    quantized: true,
                    progress_callback: (progress) => {
                        if (progress.status === 'downloading') {
                            const percent = Math.round((progress.loaded / progress.total) * 100);
                            showStatus('📥 Téléchargement: ' + percent + '%', 'loading');
                        }
                    }
                });
                showStatus('✅ Modèle chargé !', 'success');
                setTimeout(hideStatus, 2000);
            } catch (error) {
                showStatus('❌ Erreur chargement: ' + error.message, 'error');
                console.error(error);
            }
        }

        async function startCamera() {
            try {
                if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                    showStatus('❌ Erreur : HTTPS requis', 'error');
                    return;
                }
                
                showStatus('📷 Démarrage caméra...', 'loading');
                
                stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { 
                        facingMode: 'environment',
                        width: { ideal: 1280 },
                        height: { ideal: 720 }
                    } 
                });
                
                video.srcObject = stream;
                video.style.display = 'block';
                
                captureBtn.disabled = false;
                stopCameraBtn.disabled = false;
                startCameraBtn.disabled = true;
                
                hideStatus();
                loadModel(); // Charger en arrière-plan
                
            } catch (error) {
                showStatus('❌ ' + error.message, 'error');
            }
        }

        function stopCamera() {
            if (stream) {
                stream.getTracks().forEach(track => track.stop());
                video.srcObject = null;
                stream = null;
                
                captureBtn.disabled = true;
                stopCameraBtn.disabled = true;
                startCameraBtn.disabled = false;
            }
        }

        async function captureAndDescribe() {
            try {
                if (!captioner) {
                    showStatus('⏳ Modèle en cours de chargement, patientez...', 'loading');
                    await loadModel();
                    if (!captioner) return;
                }
                
                showStatus('📸 Capture...', 'loading');
                
                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;
                canvas.getContext('2d').drawImage(video, 0, 0);
                
                const imageDataUrl = canvas.toDataURL('image/jpeg', 0.7);
                imageContainer.innerHTML = '<img src="' + imageDataUrl + '">';
                
                showStatus('🤖 Analyse IA...', 'loading');
                
                const result = await captioner(imageDataUrl);
                const text = result[0].generated_text;
                
                description.textContent = text.charAt(0).toUpperCase() + text.slice(1);
                descriptionContainer.classList.add('show');
                
                showStatus('✅ Terminé !', 'success');
                setTimeout(hideStatus, 2000);
                
            } catch (error) {
                showStatus('❌ ' + error.message, 'error');
                console.error(error);
            }
        }

        startCameraBtn.addEventListener('click', startCamera);
        stopCameraBtn.addEventListener('click', stopCamera);
        captureBtn.addEventListener('click', captureAndDescribe);
        window.addEventListener('beforeunload', stopCamera);
    </script>
</body>
</html>
